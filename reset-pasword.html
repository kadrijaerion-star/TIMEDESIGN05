<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | TimeDesign</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .reset-box {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.15);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #666;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        #reset-message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="reset-box">

        <h1>TimeDesign</h1>

        <p>Vendos password-in e ri të Admin-it.</p>

        <input
            type="password"
            id="new-password"
            placeholder="Password i ri"
        >

        <input
            type="password"
            id="confirm-password"
            placeholder="Konfirmo password-in"
        >

        <button onclick="resetPassword()">
            Ndrysho password-in
        </button>

        <div id="reset-message"></div>

    </div>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL =
            "https://gpwqcfjdwwwlwutcuizpx.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_4V3NG02ni7eC6LduWqHjxA_-3s2DZgj";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        async function resetPassword() {

            const password =
                document.getElementById("new-password").value;

            const confirmPassword =
                document.getElementById("confirm-password").value;

            const message =
                document.getElementById("reset-message");


            if (!password || !confirmPassword) {

                message.textContent =
                    "Plotëso të dy fushat.";

                return;
            }


            if (password !== confirmPassword) {

                message.textContent =
                    "Password-at nuk përputhen.";

                return;
            }


            if (password.length < 6) {

                message.textContent =
                    "Password-i duhet të ketë të paktën 6 karaktere.";

                return;
            }


            const {
                error
            } = await supabaseClient.auth.updateUser({
                password: password
            });


            if (error) {

                console.error(error);

                message.textContent =
                    "Gabim: " + error.message;

                return;
            }


            message.textContent =
                "Password-i u ndryshua me sukses!";


            setTimeout(function() {

                window.location.href = "admin.html";

            }, 2000);

        }

    </script>

</body>
</html>
