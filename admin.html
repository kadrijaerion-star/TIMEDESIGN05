<!DOCTYPE html>
<html lang="sq">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>TimeDesign | Admin</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>


    <!-- ================================= -->
    <!-- ADMIN LOGIN -->
    <!-- ================================= -->

    <div
        id="loginPage"
        style="
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#f5f5f5;
            padding:20px;
        ">

        <div
            style="
                width:100%;
                max-width:400px;
                background:white;
                padding:40px;
                border-radius:15px;
                box-shadow:0 10px 40px rgba(0,0,0,0.12);
            ">

            <div
                style="
                    text-align:center;
                    margin-bottom:30px;
                ">

                <div
                    class="logo"
                    style="
                        font-size:30px;
                        margin-bottom:10px;
                    ">
                    Time<span>Design</span>
                </div>

                <h2>
                    Admin Panel
                </h2>

                <p>
                    Hyni për të menaxhuar produktet
                </p>

            </div>


            <!-- USERNAME -->

            <label>
                Username
            </label>

            <input
                type="text"
                id="loginUsername"
                placeholder="Username"
                autocomplete="username"
                style="
                    width:100%;
                    padding:14px;
                    margin:8px 0 18px;
                    border:1px solid #ddd;
                    border-radius:8px;
                    box-sizing:border-box;
                ">


            <!-- PASSWORD -->

            <label>
                Password
            </label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                autocomplete="current-password"
                style="
                    width:100%;
                    padding:14px;
                    margin:8px 0 10px;
                    border:1px solid #ddd;
                    border-radius:8px;
                    box-sizing:border-box;
                ">


            <!-- ERROR -->

            <p
                id="loginError"
                style="
                    display:none;
                    color:#d00;
                    text-align:center;
                    margin:10px 0;
                ">
                Username ose password gabim!
            </p>


            <!-- LOGIN BUTTON -->

            <button
                onclick="loginAdmin()"
                style="
                    width:100%;
                    padding:14px;
                    border:none;
                    border-radius:8px;
                    cursor:pointer;
                    font-size:16px;
                    margin-top:10px;
                ">

                Hyr në Admin

            </button>


            <div
                style="
                    text-align:center;
                    margin-top:20px;
                ">

                <a href="index.html">
                    ← Kthehu në faqe
                </a>

            </div>

        </div>

    </div>



    <!-- ================================= -->
    <!-- ADMIN PANEL -->
    <!-- ================================= -->

    <div
        id="adminPanel"
        style="display:none;">


        <!-- HEADER -->

        <header>

            <div class="logo">
                Time<span>Design</span>
            </div>

            <nav>

                <a href="index.html">
                    Shiko faqen
                </a>

                <a
                    href="#"
                    onclick="logoutAdmin(); return false;">
                    Dil
                </a>

            </nav>

        </header>



        <!-- ================================= -->
        <!-- SHTO PRODUKT -->
        <!-- ================================= -->

        <section
            id="add-product"
            class="section">

            <div class="section-title">

                <p>
                    ADMIN
                </p>

                <h2>
                    Shto produkt
                </h2>

            </div>


            <!-- EMRI -->

            <label>
                Emri i produktit
            </label>

            <input
                type="text"
                id="productName"
                placeholder="P.sh. Sallon Modern">


            <!-- KATEGORIA -->

            <label>
                Kategoria
            </label>

            <select id="productCategory">

                <option value="Dhoma dite">
                    Dhoma dite
                </option>

                <option value="Dhoma gjumi">
                    Dhoma gjumi
                </option>

                <option value="Kuzhina">
                    Kuzhina
                </option>

                <option value="Gardëroba">
                    Gardëroba
                </option>

            </select>


            <!-- FOTO -->

            <label>
                Fotografia
            </label>

            <input
                type="file"
                id="productImage"
                accept="image/*">


            <!-- PREVIEW -->

            <div
                id="imagePreview">
            </div>


            <!-- PËRSHKRIMI -->

            <label>
                Përshkrimi
            </label>

            <textarea
                id="productDescription"
                placeholder="Përshkrimi i produktit">
            </textarea>


            <!-- DIMENSIONET -->

            <label>
                Dimensionet
            </label>

            <input
                type="text"
                id="productDimensions"
                placeholder="P.sh. 250 x 180 cm">


            <!-- MATERIALI -->

            <label>
                Materiali
            </label>

            <input
                type="text"
                id="productMaterial"
                placeholder="P.sh. MDF, dru...">


            <!-- BUTONI -->

            <button
                onclick="addProduct()">

                Shto produkt

            </button>

        </section>



        <!-- ================================= -->
        <!-- PRODUKTET -->
        <!-- ================================= -->

        <section class="section">

            <div class="section-title">

                <p>
                    TIME DESIGN
                </p>

                <h2>
                    Produktet
                </h2>

            </div>


            <div
                id="adminProducts"
                class="products">
            </div>

        </section>


    </div>



    <!-- ================================= -->
    <!-- LOGIN JAVASCRIPT -->
    <!-- ================================= -->

    <script>

        const ADMIN_USERNAME = "timedesign";
        const ADMIN_PASSWORD = "1234567890";


        function loginAdmin() {

            const username =
                document.getElementById(
                    "loginUsername"
                ).value.trim();

            const password =
                document.getElementById(
                    "loginPassword"
                ).value;


            if (
                username === ADMIN_USERNAME &&
                password === ADMIN_PASSWORD
            ) {

                sessionStorage.setItem(
                    "timeDesignAdmin",
                    "true"
                );

                showAdminPanel();

            } else {

                document.getElementById(
                    "loginError"
                ).style.display = "block";

            }

        }


        function showAdminPanel() {

            document.getElementById(
                "loginPage"
            ).style.display = "none";

            document.getElementById(
                "adminPanel"
            ).style.display = "block";

        }


        function logoutAdmin() {

            sessionStorage.removeItem(
                "timeDesignAdmin"
            );

            location.reload();

        }


        document.addEventListener(
            "DOMContentLoaded",
            function() {

                if (
                    sessionStorage.getItem(
                        "timeDesignAdmin"
                    ) === "true"
                ) {

                    showAdminPanel();

                }

            }
        );


        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter" &&
                    document.getElementById(
                        "loginPage"
                    ).style.display !== "none"
                ) {

                    loginAdmin();

                }

            }
        );

    </script>


    <!-- ADMIN JS -->

    <script src="admin.js"></script>

</body>

</html>
