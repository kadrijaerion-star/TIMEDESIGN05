<!DOCTYPE html>
<html lang="sq">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TimeDesign | Admin</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- LOGIN -->

    <div id="loginPage" style="
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        background:#f5f5f5;
        padding:20px;
    ">

        <div style="
            width:100%;
            max-width:400px;
            background:white;
            padding:40px;
            border-radius:15px;
            box-shadow:0 10px 40px rgba(0,0,0,0.12);
        ">

            <div style="
                text-align:center;
                margin-bottom:30px;
            ">

                <div class="logo" style="font-size:30px;">
                    Time<span>Design</span>
                </div>

                <h2>Admin Panel</h2>

                <p>
                    Hyni për të menaxhuar produktet
                </p>

            </div>


            <label>Email</label>

<input
    type="email"
    id="loginEmail"
    placeholder="Email"
    style="
        width:100%;
        padding:14px;
        margin:8px 0;
        box-sizing:border-box;
    "
>
                style="
                    width:100%;
                    padding:14px;
                    margin:8px 0 18px;
                    box-sizing:border-box;
                ">


            <label>Password</label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                style="
                    width:100%;
                    padding:14px;
                    margin:8px 0;
                    box-sizing:border-box;
                ">


            <p
                id="loginError"
                style="
                    display:none;
                    color:red;
                    text-align:center;
                ">
                email ose password gabim!
            </p>


            <button
                id="loginButton"
                type="button"
                style="
                    width:100%;
                    padding:14px;
                    margin-top:10px;
                    cursor:pointer;
                ">
                Hyr në Admin
            </button>


            <div style="
                text-align:center;
                margin-top:20px;
            ">
                <a href="index.html">
                    ← Kthehu në faqe
                </a>
            </div>

        </div>

    </div>


    <!-- ADMIN PANEL -->

    <div id="adminPanel" style="display:none;">

        <header>

            <div class="logo">
                Time<span>Design</span>
            </div>

            <nav>

                <a href="index.html">
                    Shiko faqen
                </a>

                <a href="#" id="logoutButton">
                    Dil
                </a>

            </nav>

        </header>


        <!-- SHTO PRODUKT -->

        <section id="add-product" class="section">

            <div class="section-title">

                <p>ADMIN</p>

                <h2>
                    Shto produkt
                </h2>

            </div>


            <label>
                Emri i produktit
            </label>

            <input
                type="text"
                id="productName"
                placeholder="P.sh. Sallon Modern">


            <label>
                Kategoria
            </label>

            <select id="productCategory">

                <option value="Dhoma dite">
                    Dhoma dite
                </option>

                <option value="Dhoma gjumi">
                    Dhoma gjumi
                </option>

                <option value="Kuzhina">
                    Kuzhina
                </option>

                <option value="Gardëroba">
                    Gardëroba
                </option>

            </select>


            <label>
                Fotografia
            </label>

            <input
                type="file"
                id="productImage"
                accept="image/*">


            <div id="imagePreview"></div>


            <label>
                Përshkrimi
            </label>

            <textarea
                id="productDescription"
                placeholder="Përshkrimi i produktit">
            </textarea>


            <label>
                Dimensionet
            </label>

            <input
                type="text"
                id="productDimensions"
                placeholder="P.sh. 250 x 180 cm">


            <label>
                Materiali
            </label>

            <input
                type="text"
                id="productMaterial"
                placeholder="P.sh. MDF, dru...">


           <button
    id="addProductButton"
    type="button"
    onclick="addProduct()">

    Shto produkt

</button>

        </section>


        <!-- PRODUKTET -->

        <section class="section">

            <div class="section-title">

                <p>
                    TIME DESIGN
                </p>

                <h2>
                    Produktet
                </h2>

            </div>

            <div
                id="adminProducts"
                class="products">
            </div>

        </section>

    </div>


    <!-- ================================= -->
    <!-- LOGIN + ADMIN SYSTEM -->
    <!-- ================================= -->

    <script>

        const ADMIN_USERNAME = "timedesign";
        const ADMIN_PASSWORD = "1234567890";


        const loginPage =
            document.getElementById("loginPage");

        const adminPanel =
            document.getElementById("adminPanel");

        const loginButton =
            document.getElementById("loginButton");

        const logoutButton =
            document.getElementById("logoutButton");


        function showAdminPanel() {

            loginPage.style.display = "none";

            adminPanel.style.display = "block";

        }


        function loginAdmin() {

            const username =
                document.getElementById(
                    "loginUsername"
                ).value.trim();

            const password =
                document.getElementById(
                    "loginPassword"
                ).value;


            if (
                username === ADMIN_USERNAME &&
                password === ADMIN_PASSWORD
            ) {

                sessionStorage.setItem(
                    "timeDesignAdmin",
                    "true"
                );

                document.getElementById(
                    "loginError"
                ).style.display = "none";

                showAdminPanel();

            } else {

                document.getElementById(
                    "loginError"
                ).style.display = "block";

            }

        }


        function logoutAdmin() {

            sessionStorage.removeItem(
                "timeDesignAdmin"
            );

            location.reload();

        }


        loginButton.addEventListener(
            "click",
            loginAdmin
        );


        logoutButton.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                logoutAdmin();

            }
        );


        document
            .getElementById("loginPassword")
            .addEventListener(
                "keydown",
                function(event) {

                    if (event.key === "Enter") {
                        loginAdmin();
                    }

                }
            );


        if (
            sessionStorage.getItem(
                "timeDesignAdmin"
            ) === "true"
        ) {

            showAdminPanel();

        }

    </script>


    <!-- ADMIN JS -->

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js"></script>

</body>

</html>
